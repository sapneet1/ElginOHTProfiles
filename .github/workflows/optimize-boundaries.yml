
name: Optimize Map Boundaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install shapely

      - name: Simplify GeoJSON files
        shell: python
        run: |
          import json
          from pathlib import Path
          from shapely.geometry import shape, mapping

          for filename in [
              "fsa_boundaries.geojson",
              "csd_boundaries.geojson"
          ]:
              path = Path(filename)

              if not path.exists():
                  print(f"Skipping missing file: {filename}")
                  continue

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              original_size = path.stat().st_size

              for feature in data.get("features", []):
                  geometry = feature.get("geometry")

                  if not geometry:
                      continue

                  polygon = shape(geometry)

                  if polygon.is_empty:
                      continue

                  simplified = polygon.simplify(
                      tolerance=0.0005,
                      preserve_topology=True
                  )

                  feature["geometry"] = mapping(simplified)

              with path.open("w", encoding="utf-8") as f:
                  json.dump(data, f, separators=(",", ":"))

              new_size = path.stat().st_size

              print(
                  f"{filename}: "
                  f"{original_size:,} → {new_size:,} bytes"
              )

      - name: Commit optimized boundaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fsa_boundaries.geojson csd_boundaries.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Optimize GeoJSON map boundaries"
            git push
          fi
